services:
  steerpy:
    image: node:22-alpine
    working_dir: /workspace
    command: >
      sh -lc '
        if [ ! -f index.html ]; then
          echo "SteerPy app not found in this directory; skipping SteerPy live server.";
          exit 0;
        fi;
        npx -y browser-sync start --server . --files "**/*" --host 0.0.0.0 --port 8000 --ui-port 8001 --no-open --no-notify
      '
    ports:
      - "${STEERPY_PORT:-8000}:8000"
      - "${STEERPY_UI_PORT:-8001}:8001"
    volumes:
      - .:/workspace
